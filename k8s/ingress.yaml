apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: btc-forecast-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: btc-forecast.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: btc-forecast-service
                port:
                  number: 80